<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantage</title>

  <!-- Leaflet's CSS (needed before our own stylesheet) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header id="app-header">
    <h1>Vantage</h1>
    <p class="tagline">Claim your city. One photo at a time.</p>
  </header>

  <!-- Leaflet draws the map into this div -->
  <div id="map"></div>

  <!-- Simple info panel that shows details for whichever turf zone is selected -->
  <aside id="turf-panel" class="hidden">
    <button id="turf-panel-close" aria-label="Close">&times;</button>
    <h2 id="turf-panel-title">Zone name</h2>
    <p id="turf-panel-desc">Zone description</p>
    <button id="turf-panel-claim">Claim this turf</button>
    <p id="turf-panel-status"></p>
  </aside>

  <!-- Leaflet's JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="js/landmarks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
