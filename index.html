<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vantage</title>

  <!-- Leaflet's CSS (needed before our own stylesheet) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header id="app-header">
    <div id="app-header-title">
      <h1>Vantage</h1>
      <p class="tagline">Claim your city. One photo at a time.</p>
    </div>

    <!-- Account panel: sign up / log in when logged out, a "who am I,
         log out" strip when logged in. app.js swaps which half shows. -->
    <div id="auth-panel">
      <div id="auth-logged-out">
        <form id="auth-form" autocomplete="on">
          <input
            type="text"
            id="auth-username"
            placeholder="Username"
            autocomplete="username"
            required
          />
          <input
            type="password"
            id="auth-password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <div class="auth-buttons">
            <button type="submit" id="auth-login-btn">Log in</button>
            <button type="button" id="auth-signup-btn">Sign up</button>
          </div>
        </form>
      </div>

      <div id="auth-logged-in" class="hidden">
        <span id="auth-username-display"></span>
        <button id="auth-logout-btn">Log out</button>
      </div>

      <p id="auth-error"></p>
    </div>
  </header>

  <!-- Leaflet draws the map into this div -->
  <div id="map"></div>

  <!-- Simple info panel that shows details for whichever turf zone is selected -->
  <aside id="turf-panel" class="hidden">
    <button id="turf-panel-close" aria-label="Close">&times;</button>
    <h2 id="turf-panel-title">Zone name</h2>
    <p id="turf-panel-desc">Zone description</p>
    <button id="turf-panel-claim">Claim this turf</button>
    <p id="turf-panel-status"></p>
  </aside>

  <!-- Leaflet's JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
